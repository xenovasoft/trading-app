name: Signal Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Two runs must never overlap: run_check_v2 reads bot_state_v2, decides
# transitions against it, then writes it back. Two jobs interleaving there can
# lose a state change or fire a duplicate alert. Queue instead of cancelling —
# cancelling mid-run could abandon a partially-written state.
concurrency:
  group: signal-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # REVERTED: a 3x-loop-with-sleep(300) here was tried to paper over
      # GitHub's scheduler slippage, but it turned each run from ~1 min into
      # ~11 min. On a */15 cron against a private repo's free 2,000
      # Actions-minutes/month quota, that exhausts the quota in ~2 days, and
      # GitHub fails every subsequent job almost instantly once minutes run
      # out — which is exactly the "failed in 2 seconds, every run" spam this
      # caused. Back to one run per trigger; the concurrency guard above is
      # still worth keeping regardless.
      - name: Run signal check (v2 engine)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python run_check_v2.py
