<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal Engine v2</title>
<style>
  :root{--bg:#0b0d12;--card:#151821;--card2:#1b1f2b;--bd:#262b38;--tx:#e6e9f0;
    --dim:#8a90a2;--grn:#22c55e;--red:#ef4444;--gry:#6b7280;--amb:#f59e0b;--blu:#3b82f6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,Helvetica,Arial,sans-serif;
    padding:max(18px,env(safe-area-inset-top)) 16px calc(env(safe-area-inset-bottom) + 32px)}
  header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;padding:4px 4px 16px}
  h1{font-size:18px;margin:0;font-weight:650}
  .sub{font-size:12px;color:var(--dim)}
  .asset{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
  .arow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .aname{font-size:17px;font-weight:650}
  .price{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;
    display:inline-flex;align-items:baseline;gap:8px}
  .price.flash{animation:flashp .9s ease}
  @keyframes flashp{0%{color:#fff}100%{color:var(--tx)}}
  .delta{font-size:13px;font-weight:700;display:inline-flex;align-items:center;
    gap:2px;font-variant-numeric:tabular-nums}
  .delta.up{color:var(--grn)} .delta.down{color:var(--red)} .delta.flat{color:var(--dim)}
  .pricerow{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
  .sincenote{font-size:10px;color:var(--dim);font-weight:500}
  .inst{font-size:11px;color:var(--dim)}
  .gate{background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.35);
    border-radius:10px;padding:10px 12px;margin:12px 0;font-size:12.5px}
  .gate b{color:var(--red)} .gate div{color:#fca5a5;margin-top:3px}
  .futwarn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.4);
    border-radius:10px;padding:10px 12px;margin:12px 0;font-size:12.5px;color:#fde68a}
  .futwarn b{color:var(--amb);display:block;margin-bottom:3px;font-size:13px}
  .futwarn .gap{color:var(--tx);font-weight:700}
  .profiles{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
  @media(min-width:880px){.profiles{grid-template-columns:1fr 1fr}}
  .prof{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:14px}
  .ptop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
  .pname{font-weight:650;letter-spacing:.05em;font-size:11px;color:var(--dim)}
  .badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.03em;white-space:nowrap}
  .b-long{background:rgba(34,197,94,.16);color:var(--grn)}
  .b-short{background:rgba(239,68,68,.16);color:var(--red)}
  .b-wait{background:rgba(245,158,11,.16);color:var(--amb)}
  .b-no{background:rgba(107,114,128,.2);color:var(--gry)}
  /* Big, unmistakable instruction — the answer to "so what do I actually do".
     This sits above everything else in the card on purpose. */
  .action{display:flex;align-items:center;gap:10px;margin:8px 0 10px;
    padding:12px 14px;border-radius:10px;font-size:17px;font-weight:750;
    line-height:1.3}
  .action .ic{font-size:22px;flex:0 0 auto}
  .action .sm{display:block;font-size:12.5px;font-weight:600;opacity:.85;margin-top:2px}
  .action.go-long{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.4);color:var(--grn)}
  .action.go-short{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:var(--red)}
  .action.go-wait{background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.4);color:var(--amb)}
  .action.go-no{background:rgba(107,114,128,.15);border:1px solid rgba(107,114,128,.4);color:var(--tx)}
  .dirline{font-size:15px;line-height:1.5;margin:0 0 10px;padding:9px 11px;border-radius:8px;
    background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.25)}
  .dirline b.long{color:var(--grn)} .dirline b.short{color:var(--red)}
  .action b.long{color:var(--grn)} .action b.short{color:var(--red)}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-size:12.5px}
  .kv span:first-child{color:var(--dim)}
  .kv span:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:5px;background:var(--bd);border-radius:3px;overflow:hidden;margin:6px 0 10px}
  .bar div{height:100%;border-radius:3px}
  .lvls{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}
  .lvls td{padding:3px 0}
  .lvls td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .lvls td:first-child{color:var(--dim)}
  .sec{margin-top:12px;margin-bottom:4px;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.07em;color:var(--dim)}
  .rsn{font-size:13px;line-height:1.45;margin:4px 0;display:flex;gap:7px;align-items:flex-start}
  .rsn i{font-style:normal;flex:0 0 12px}
  .ok i{color:var(--grn)} .no i{color:var(--red)} .blk i{color:var(--amb)}
  .rsn span{opacity:.9}
  .warn{font-size:12.5px;color:var(--amb);margin-top:6px}
  .inval{font-size:12.5px;line-height:1.5;color:var(--dim);margin-top:8px;
    padding-top:8px;border-top:1px dashed var(--bd)}
  .inval b{color:var(--tx)}
  .foot{font-size:11px;color:var(--dim);margin-top:20px;padding:12px;
    background:var(--card);border:1px solid var(--bd);border-radius:10px}
  .foot b{color:var(--amb)}
  details summary{cursor:pointer;color:var(--dim);font-size:10.5px;
    text-transform:uppercase;letter-spacing:.07em;margin-top:10px}
  .z{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 0;
    border-bottom:1px solid var(--bd);font-size:12px}
  .z:last-child{border-bottom:none}
  .hist-row{padding:9px 0;border-bottom:1px solid var(--bd)}
  .hist-row:last-child{border-bottom:none}
  .hist-row.expired{opacity:.55}
  .hist-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
  .hist-dir{font-size:12px;font-weight:700;letter-spacing:.03em}
  .hist-dir.long{color:var(--grn)} .hist-dir.short{color:var(--red)}
  .hist-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
  .hist-tag.active{background:rgba(34,197,94,.16);color:var(--grn)}
  .hist-tag.old{background:rgba(107,114,128,.2);color:var(--dim)}
  .stamp{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:2px 0 10px;
    font-size:12px;color:var(--dim)}
  .stamp b{color:#c8cddb;font-weight:600}
  .stamp .st{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;
    letter-spacing:.03em}
  .stamp .st.now{background:rgba(34,197,94,.16);color:var(--grn)}
  .stamp .st.aging{background:rgba(245,158,11,.16);color:var(--amb)}
  .stamp .st.old{background:rgba(239,68,68,.16);color:var(--red)}
  .hist-time{font-size:11px;color:var(--dim);margin-left:auto}
  .hist-msg{font-size:12px;color:#c8cddb;line-height:1.4;white-space:pre-line}
  .hist-row.expired .hist-msg{text-decoration:line-through;text-decoration-color:var(--bd)}
  .zk{color:var(--dim);font-size:11px}
  .zbar{height:4px;background:var(--bd);border-radius:2px;margin-top:4px;overflow:hidden}
  .zbar div{height:100%;background:var(--blu)}
  .side-buy{color:var(--grn)} .side-sell{color:var(--red)}
  .empty{text-align:center;color:var(--dim);padding:40px 0}
  .chartwrap{background:var(--card);border:1px solid var(--bd);border-radius:14px;
    padding:14px;margin-bottom:16px}
  .charttop{display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:10px;margin-bottom:10px}
  .charttitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .charttitle .cname{font-size:15px;font-weight:650}
  .charttitle .cprice{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .livepill{font-size:9.5px;font-weight:700;letter-spacing:.05em;color:var(--grn);
    background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.35);
    border-radius:999px;padding:2px 7px;display:inline-flex;align-items:center;gap:4px}
  .livepill .dot{width:5px;height:5px;border-radius:50%;background:var(--grn);
    animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .tfrow{display:flex;gap:6px}
  .tfbtn{appearance:none;-webkit-appearance:none;cursor:pointer;background:var(--card2);
    color:var(--dim);border:1px solid var(--bd);border-radius:7px;padding:5px 11px;
    font-size:11.5px;font-weight:700;font-family:inherit;
    -webkit-tap-highlight-color:transparent}
  .tfbtn.on{background:#2a3142;color:var(--tx);border-color:#454e64}
  .chartbox{width:100%;height:260px}
  .charterr{color:var(--dim);font-size:12.5px;text-align:center;padding:40px 0}
  .chart24h{display:flex;gap:16px;margin-top:8px;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
  .chart24h b{color:var(--tx);font-variant-numeric:tabular-nums}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:0 4px 14px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;cursor:pointer;background:var(--card);color:var(--dim);
    border:1px solid var(--bd);border-radius:999px;padding:8px 14px;
    font-size:12.5px;font-weight:600;font-family:inherit;white-space:nowrap;
    display:inline-flex;align-items:center;gap:7px;
    transition:background .15s,color .15s,border-color .15s;
    -webkit-tap-highlight-color:transparent}
  .tab:hover{background:var(--card2);color:var(--tx)}
  .tab.on{background:#232838;color:var(--tx);border-color:#3f4759}
  .tab .px{font-weight:500;opacity:.7;font-variant-numeric:tabular-nums}
  .tab .px.delta-up{color:var(--grn);opacity:1} .tab .px.delta-down{color:var(--red);opacity:1}
  .tab .dot{width:7px;height:7px;border-radius:50%;background:var(--gry);flex:0 0 auto}
  .tab .dot.long{background:var(--grn)} .tab .dot.short{background:var(--red)}
  .tab .dot.wait{background:var(--amb)} .tab .dot.stale{background:#7f1d1d}
  .hright{display:flex;align-items:center;gap:10px}
  #refresh{appearance:none;-webkit-appearance:none;cursor:pointer;
    background:var(--card2);color:var(--tx);border:1px solid var(--bd);
    border-radius:999px;padding:7px 14px;font-size:12px;font-weight:600;
    font-family:inherit;display:inline-flex;align-items:center;gap:6px;
    transition:background .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
  #refresh:hover:not(:disabled){background:#232838;border-color:#3a4152}
  #refresh:active:not(:disabled){transform:scale(.97)}
  #refresh:disabled{opacity:.55;cursor:default}
  #refresh svg{width:13px;height:13px;display:block}
  #refresh.busy svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #guideBtn{appearance:none;-webkit-appearance:none;cursor:pointer;
    background:var(--card2);color:var(--tx);border:1px solid var(--bd);
    border-radius:999px;padding:7px 14px;font-size:12px;font-weight:600;
    font-family:inherit;display:inline-flex;align-items:center;gap:6px;
    transition:background .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
  #guideBtn:hover{background:#232838;border-color:#3a4152}
  #guideBtn svg{width:13px;height:13px;display:block}
  #scalpBtn{appearance:none;-webkit-appearance:none;cursor:pointer;
    background:var(--card2);color:var(--tx);border:1px solid var(--bd);
    border-radius:999px;padding:7px 14px;font-size:12px;font-weight:600;
    font-family:inherit;display:inline-flex;align-items:center;gap:6px;
    transition:background .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
  #scalpBtn:hover{background:#232838;border-color:#3a4152}
  #scalpBtn svg{width:13px;height:13px;display:block}
  #scalpBtn.on{background:rgba(245,158,11,.16);color:var(--amb);border-color:rgba(245,158,11,.45)}

  .backdrop{display:none;position:fixed;inset:0;background:rgba(5,6,9,.72);
    z-index:50;padding:16px;padding-top:max(16px,env(safe-area-inset-top));
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .backdrop.open{display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:640px){.backdrop.open{align-items:center}}
  .modal{background:var(--card);border:1px solid var(--bd);border-radius:16px 16px 0 0;
    max-width:560px;width:100%;max-height:85vh;overflow-y:auto;
    padding:18px 18px calc(env(safe-area-inset-bottom) + 20px)}
  @media(min-width:640px){.modal{border-radius:16px;max-height:80vh}}
  .modtop{display:flex;justify-content:space-between;align-items:center;
    margin-bottom:14px;position:sticky;top:-18px;background:var(--card);
    padding:18px 0 10px;margin-top:-18px}
  .modtop h2{font-size:17px;margin:0}
  #closeGuide{appearance:none;-webkit-appearance:none;cursor:pointer;
    background:var(--card2);color:var(--dim);border:1px solid var(--bd);
    border-radius:999px;width:30px;height:30px;font-size:16px;line-height:1;
    -webkit-tap-highlight-color:transparent}
  .term{margin-bottom:16px}
  .term h3{font-size:14px;margin:0 0 4px;color:var(--tx);display:flex;align-items:center;gap:8px}
  .term h3 .tag{font-size:10px;font-weight:700;color:var(--dim);background:var(--card2);
    border:1px solid var(--bd);border-radius:6px;padding:1px 6px}
  .term p{font-size:13px;line-height:1.55;color:#c8cddb;margin:0}
  .term p b{color:var(--tx)}
  .gsec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
    margin:18px 0 8px;padding-top:10px;border-top:1px solid var(--bd)}
  .gsec:first-child{margin-top:0;padding-top:0;border-top:none}
</style>
</head>
<body>

<header>
  <div><h1>Signal Engine v2</h1><div class="sub" id="sub">loading…</div></div>
  <div class="hright">
    <div class="sub" id="age"></div>
    <button id="scalpBtn" type="button" title="Sirf SCALP setups, teeno assets ek saath">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"

      </svg>

    </button>

        <circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.5 2.5 0 0 1 4.9.8c0 1.6-2.4 2-2.4 3.5"/>
        <circle cx="12" cy="17" r=".6" fill="currentColor" stroke="none"/>
      </svg>
      <span>Guide</span>
    </button>
    <button id="refresh" type="button" title="Re-read the latest stored analysis">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>

      <span id="refreshLabel">Refresh</span>
    </button>
  </div>
</header>
<div class="tabs" id="tabs"></div>
<div class="chartwrap" id="chartWrap" style="display:none">
  <div class="charttop">
    <div class="charttitle">
      <span class="cname" id="chartName">—</span>
      <span class="cprice" id="chartPrice">—</span>
      <span class="livepill" id="livePill"><span class="dot"></span>LIVE</span>

    <div class="modtop"><h2>Trade Guide</h2>
      <button id="closeGuide" type="button" aria-label="Band karein">✕</button></div>
    <div id="guideBody"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const SUPABASE_URL="https://vjjnowmsvngijxvkvqhx.supabase.co";
const SUPABASE_KEY="sb_publishable_FE879GUYSj-Pw1gp1-kZ2g_h9qbtHmP";
const ORDER=["XAUUSD","XAGUSD","BTCUSD"];
const DP={XAUUSD:2,XAGUSD:3,BTCUSD:2};
/* XAUUSD now reads Kraken PAXGUSD (a token redeemable 1:1 for physical LBMA
   gold, so arbitrage pins it to real spot — verified within 0.15% of a
   user-reported live fill, vs the COMEX GC=F futures it used to read, which
   was $60+/1.5% off spot the same day). XAGUSD still has no free
   spot-tracking source (no tokenized silver exists on Kraken or Binance —
   checked both) so it stays on SI=F futures and keeps this warning.
   BTCUSD has no entry here: Kraken XBTUSD is genuinely spot. */
const FUTURES_PROXY={XAGUSD:"COMEX Silver futures (SI=F)"};
const PROFILES=["SWING","SCALP"];
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const f=(v,d)=>v==null?"—":Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const arr=v=>Array.isArray(v)?v:(v?JSON.parse(v):[]);
function ago(iso){const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+"m ago";
  if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago";}

function badge(d){const m={LONG:"b-long",SHORT:"b-short",WAIT:"b-wait"};
  return `<span class="badge ${m[d]||"b-no"}">${esc(d||"—")}</span>`;}

/* Exact clock time each prediction was generated, plus whether it is the
   CURRENT one or a leftover from an earlier run.

   This matters because the page polls Supabase every 30s and the live price
   ticks every 2s, so the screen always LOOKS live — but the analysis behind
   it only changes when the 15-minute cron runs. Without a per-card stamp a
   prediction computed an hour ago (a failed cron, a closed market) is
   visually indistinguishable from one computed a minute ago, which is
   exactly the situation where acting on it is most costly.

   Thresholds follow the 15-minute cron: one missed run is still plausibly
   current, two means something is wrong. */
function predStamp(iso){
  if(!iso) return `<div class="stamp"><span class="st old">WAQT MALOOM NAHI</span>
    <span>is prediction ka waqt record nahi hua</span></div>`;
  const t=new Date(iso), mins=(Date.now()-t.getTime())/60000;
  const clock=t.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  const day=t.toLocaleDateString([],{day:"2-digit",month:"short"});
  let cls,lbl,note;
  if(mins<=20){ cls="now"; lbl="ABHI KA"; note="ye current prediction hai"; }
  else if(mins<=45){ cls="aging"; lbl="THORA PURANA";
    note="engine ka agla run aane wala hai"; }
  else { cls="old"; lbl="PICHLA"; note="ye purani prediction hai — market band ho sakti hai ya engine ka run miss hua"; }
  return `<div class="stamp"><span class="st ${cls}">${lbl}</span>
    <span>Banaya gaya: <b>${esc(clock)}</b> <span class="zk">${esc(day)}</span>
    · ${esc(ago(iso))}</span>
    <span class="zk">${esc(note)}</span></div>`;
}

/* Order-related explanation in Roman Urdu (Urdu written in English letters).
   Trading terms (LONG/SHORT/entry/stop/target) are left in English on purpose —
   they are the words used on every broker platform, so translating them would
   make the screen harder to match against an actual order ticket. */
function directionLine(r){
  const dir=r.direction_considered, dec=r.decision;
  if(!dir) return `<div class="dirline">Koi direction check nahi hui — data
    purana hone ki wajah se analysis rok di gayi.</div>`;
  const cls=dir==="LONG"?"long":"short";
  const word=dir==="LONG"?"khareedne":"bechne";
  let verdict;
  if(dec===dir)
    verdict=`<b class="${cls}">${dir} le sakte hain</b> — sab conditions poori hain aur price entry par hai.`;
  else if(dec==="WAIT")
    verdict=`<b class="${cls}">${dir} setup tayyar hai</b> — sab conditions poori hain, lekin price abhi entry tak nahi pohancha, is liye order pending rakha hai.`;
  else
    verdict=`<b class="${cls}">${dir} ka case zyada mazboot tha</b>, lekin ye <b>reject</b> ho gaya — wajohat neeche dekhein.`;
  return `<div class="dirline">Engine ne dono sides ka jaiza liya aur
    <b class="${cls}">${esc(dir)}</b> (${word}) ka case behtar paya. ${verdict}</div>`;
}

/* The big instruction banner — this is the direct answer to "ab karna kya
   hai". directionLine() below stays as the shorter supporting explanation. */
/* livePx is the real-time ticker price (see livePrice()), NOT r.price —
   r.price/r.entry/r.stop/r.tp* are all frozen at whenever the 15-min engine
   last ran. Showing r.price as "abhi X hai" ("current price is X") next to
   the genuinely live price elsewhere on the same screen was actively
   misleading whenever the two drift apart (e.g. after a gap in cron runs —
   BTC moved 65k->79k across one such gap in this app's own history). Every
   "current price" shown in this banner must be the live one, and the gap
   to entry must be explicit so it's obvious whether an order is close or
   effectively stale. */
function priceGap(entry,livePx,dp){
  if(entry==null||livePx==null) return "";
  const diff=livePx-entry, pct=entry?100*diff/entry:0;
  return ` (${diff>0?"+":""}${f(diff,dp)} / ${pct>0?"+":""}${pct.toFixed(2)}% door)`;
}
function actionBanner(r,livePx){
  const dir=r.direction_considered, dec=r.decision, dp=DP[r.asset]??2;
  const lp=livePx??r.price;
  if(!dir) return `<div class="action go-no"><span class="ic">🚫</span>
    <div>Koi trade nahi<span class="sm">Data purana hai, engine ne check hi nahi kiya</span></div></div>`;
  if(dec===dir){
    const cls=dir==="LONG"?"go-long":"go-short";
    const ic=dir==="LONG"?"🟢":"🔴";
    return `<div class="action ${cls}"><span class="ic">${ic}</span>
      <div>${dir} KAREIN — ${f(r.entry,dp)} par order lagayein
      <span class="sm">Stop Loss ${f(r.stop,dp)} · Target 1: ${f(r.tp1,dp)}
      <br>Abhi live price: <b>${f(lp,dp)}</b>${priceGap(r.entry,lp,dp)} — order lagane se pehle
      confirm karein price abhi bhi entry ke qareeb hai</span></div></div>`;
  }
  if(dec==="WAIT"){
    const cls=dir==="LONG"?"go-long":"go-short";
    return `<div class="action go-wait"><span class="ic">⏳</span>
      <div>ABHI RUKEIN, ORDER TAIYAR HAI
      <span class="sm">${dir} tab trigger hoga jab price ${f(r.entry,dp)} tak pohanche
      (abhi live price <b>${f(lp,dp)}</b> hai${priceGap(r.entry,lp,dp)})</span></div></div>`;
  }
  const dcls=dir==="LONG"?"long":"short";
  return `<div class="action go-no"><span class="ic">🚫</span>
    <div>KUCH NA KAREIN — <b class="${dcls}">${dir}</b> ka moqa dekha gaya tha, reject ho gaya
    <span class="sm">Conditions poori nahi huin, is liye koi order nahi
    · abhi live price: ${f(lp,dp)}</span></div></div>`;
}

function zoneRow(z,dp){
  const side=z.side==="buy_side"?"side-buy":"side-sell";
  const lbl=z.side==="buy_side"?"buy-side ▲":"sell-side ▼";
  return `<div class="z"><div>
    <div><b>${f(z.low,dp)} – ${f(z.high,dp)}</b> <span class="${side}">${lbl}</span></div>
    <div class="zk">${esc((z.kinds||[]).slice(0,3).join(" · "))} · ${z.confirmations} conf ·
      ${z.tests} tests · ${z.distance_atr>0?"+":""}${z.distance_atr} ATR</div>
    <div class="zbar"><div style="width:${z.strength}%"></div></div></div>
    <div style="text-align:right"><b>${Math.round(z.strength)}</b>
    <div class="zk">${esc(z.probability)}</div></div></div>`;
}

function profileCard(name,r,dp,hist,livePx){
  if(!r) return `<div class="prof"><div class="ptop"><span class="pname">${name}</span>
    ${badge(null)}</div><div class="sub">no data yet</div></div>`;
  const sc=r.confluence_score??0;
  const col=sc>=70?"var(--grn)":sc>=50?"var(--amb)":"var(--red)";
  const forR=arr(r.reasons_for), agR=arr(r.reasons_against), blk=arr(r.blockers);
  const lp=livePx??r.price;
  /* A NO TRADE setup's entry/stop/target were computed and then rejected —
     they are the engine's internal working, not an order. Showing them in
     the same bold table as a real order (label: "yahan order lagayein" =
     "place your order here") is exactly how a rejected SHORT sitting well
     below current price gets misread as a live instruction to sell there
     right now. Actionable (LONG/SHORT/WAIT) keeps the direct order framing;
     NO TRADE gets neutral wording and lives inside a closed <details>. */
  const actionable=r.decision==="WAIT"||r.decision===r.direction_considered;
  const rows=[];
  if(r.entry!=null) rows.push(`<tr><td>Entry <span class="zk">${actionable?"yahan order lagayein":"engine ne yahan check kiya (order nahi)"} · ${esc(r.entry_type||"")}</span></td><td>${f(r.entry,dp)}<span class="zk">${esc(priceGap(r.entry,lp,dp))}</span></td></tr>`);
  if(r.stop!=null) rows.push(`<tr><td>Stop loss <span class="zk">${actionable?"yahan nikal jayein":"agar trade hota to"} · ${r.stop_atr} ATR</span></td><td>${f(r.stop,dp)}</td></tr>`);
  [1,2,3].forEach(i=>{const p=r["tp"+i];if(p!=null)
    rows.push(`<tr><td>Target ${i} <span class="zk">${esc(i===1?(r.tp1_anchor||""):"")}</span></td>
      <td>${f(p,dp)} <span class="zk">${r["tp"+i+"_rr"]??"—"}R</span></td></tr>`);});
  if(r.primary_rr!=null) rows.push(`<tr><td>Risk : Reward <span class="zk">Target 1 tak</span></td><td>${r.primary_rr}</td></tr>`);
  if(r.lots!=null) rows.push(`<tr><td>Position size <span class="zk">kitna lena hai</span></td><td>${r.lots} lots</td></tr>`);

  return `<div class="prof">
    <div class="ptop"><span class="pname">${name} · ${esc(r.expected_hold||"")}</span>${badge(r.decision)}</div>
    ${predStamp(r.updated_at)}
    ${actionBanner(r,lp)}
    ${directionLine(r)}
    <div class="kv"><span>Confluence <span class="zk">kitne point mile</span></span><span>${sc}/100 (${r.confirmations_passed??"—"}/${r.confirmations_total??"—"})
      ${r.counter_trend?' <b style="color:var(--amb)">trend ke khilaf</b>':""}</span></div>
    <div class="bar"><div style="width:${sc}%;background:${col}"></div></div>
    <div class="kv"><span>Market ka mizaj</span><span>${esc(r.regime||"—")} (ADX ${r.adx??"—"})</span></div>
    <div class="kv"><span>Bara trend (HTF)</span><span>${esc(r.htf_bias||"—")}</span></div>
    <div class="kv"><span>Structure</span><span>${esc(r.structure_trend||"—")} · ${esc(r.structure_event||"—")}</span></div>
    <div class="kv"><span>Premium / Discount</span><span>${esc(r.pd_label||"—")} (${r.pd_position??"—"})</span></div>
    ${rows.length?(actionable
      ?`<table class="lvls">${rows.join("")}</table>`
      :`<details><summary>Engine ka calculation (ye order NAHI hai, sirf reject hua case)</summary>
         <table class="lvls">${rows.join("")}</table></details>`):""}
    ${r.invalidation?`<div class="inval"><b>Kab ghalat sabit hoga:</b> ${esc(r.invalidation)}</div>`:""}

    ${blk.length?`<div class="sec">Ye trade kyun nahi hai</div>`+
      blk.map(b=>`<div class="rsn blk"><i>✗</i><span>${esc(b)}</span></div>`).join(""):""}

    ${forR.length?`<div class="sec">${esc(r.direction_considered||"")} ke haq main dalail</div>`+
      forR.map(x=>`<div class="rsn ok"><i>+</i><span>${esc(x)}</span></div>`).join(""):""}

    ${agR.length?`<div class="sec">Khilaf dalail</div>`+
      agR.map(x=>`<div class="rsn no"><i>−</i><span>${esc(x)}</span></div>`).join(""):""}

    <details ${hist&&hist.length?"open":""}><summary>Trade History · 24h (${hist?hist.length:0})</summary>
      ${historyHTML(hist,dp)}
    </details>

    <details><summary>Liquidity map (${arr(r.zones).length})</summary>
      ${arr(r.zones).map(z=>zoneRow(z,dp)).join("")||'<div class="sub">none</div>'}
    </details>
  </div>`;
}

/* Trade History (24h). Groups NEW_SIGNAL alerts by asset+profile. The most
   recent one per group is the current call; every older one in the SAME
   group is EXPIRED — a later signal for the same asset+profile always
   supersedes the previous one, whether it agreed or reversed direction. */
function extractProfile(row){
  if(row.profile) return row.profile;
  // Legacy v2 rows written before the `profile` column existed still have
  // the profile name as a word in the title, e.g. "BTCUSD SCALP: ...". Old
  // v1-engine rows never had SWING/SCALP in the title at all — those are
  // deliberately left unclassifiable (null) so they get filtered out below
  // rather than silently defaulting into the wrong profile's history.
  const m=String(row.title||"").match(/\b(SWING|SCALP)\b/);
  return m?m[1]:null;
}
function extractDirection(row){
  const m=String(row.title||"").match(/\b(LONG|SHORT)\b/);
  return m?m[1]:null;
}
async function fetchHistory(){
  try{
    const r=await fetch("/api/history",{cache:"no-store"});
    if(r.ok){ const j=await r.json(); if(Array.isArray(j)) return j; }
  }catch(e){/* fall through */}
  try{
    const since=new Date(Date.now()-24*3600*1000).toISOString();
    const {data}=await client.from("alerts").select("id,asset,profile,type,title,message,created_at")
      .eq("type","NEW_SIGNAL").gte("created_at",since).order("created_at",{ascending:false}).limit(300);
    return data||[];
  }catch(e){ return []; }
}
function groupHistory(rows){
  const by={};
  rows.forEach(r=>{
    const p=extractProfile(r);
    if(!p) return; // pre-v2 row with no way to know which profile issued it
    const key=r.asset+"|"+p;
    (by[key]=by[key]||[]).push(r);
  });
  return by;
}
function historyHTML(list,dp){
  if(!list||!list.length) return `<div class="sub" style="padding:4px 0">Pichle 24 ghante mein koi signal nahi.</div>`;
  return list.map((row,i)=>{
    const dir=extractDirection(row);
    const cls=dir==="LONG"?"long":dir==="SHORT"?"short":"";
    const active=i===0;
    return `<div class="hist-row ${active?"":"expired"}">
      <div class="hist-top">
        <span class="hist-dir ${cls}">${esc(dir||"—")}</span>
        ${active?`<span class="hist-tag active">ABHI ACTIVE</span>`
                :`<span class="hist-tag old">EXPIRED — naya signal aa gaya</span>`}
        <span class="hist-time">${ago(row.created_at)}</span>
      </div>
      <div class="hist-msg">${esc((row.message||"").split("\n")[0])}</div>
    </div>`;
  }).join("");
}

/* Fetch order matters. The same-origin /api/signals route is tried FIRST
   because a cross-origin fetch to supabase.co fails inside the iOS Capacitor
   WKWebView ("TypeError: Load failed") even though it works in Safari. The
   direct Supabase call is kept as a fallback so the page still works when
   opened without the serverless route (e.g. a plain static file server). */
async function fetchSignals(){
  try{
    const r=await fetch("/api/signals",{cache:"no-store"});
    if(r.ok){
      const j=await r.json();
      if(Array.isArray(j)) return {data:j,error:null,via:"same-origin"};
    }
  }catch(e){/* fall through to direct */}
  try{
    const {data,error}=await client.from("signals_v2").select("*");
    return {data,error,via:"supabase-direct"};
  }catch(e){
    return {data:null,error:{message:String(e&&e.message||e)},via:"failed"};
  }
}

/* Asset selector. Kept in localStorage so the choice survives the 30s
   auto-refresh and app restarts — otherwise every poll would snap the view
   back to "Sab" while you were reading one asset. */
let selected=localStorage.getItem("selectedAsset")||"ALL";

function pickAsset(a){
  selected=a;
  try{localStorage.setItem("selectedAsset",a);}catch(e){}
  // Cheap: re-render from data already in memory rather than re-hitting
  // Supabase just to switch which asset is visible.
  if(lastBy) render(lastBy,lastHistByKey);
  syncChartToSelection();
}

/* Scalp scan: one tap shows all 3 assets' SCALP card only, side by side, so
   a fast-moving opportunity doesn't get missed behind tab-switching or
   scrolling past a SWING card that isn't relevant right now. */
let scalpOnly=false;
function toggleScalpOnly(){
  scalpOnly=!scalpOnly;
  if(scalpOnly){ selected="ALL"; try{localStorage.setItem("selectedAsset","ALL");}catch(e){} }
  document.getElementById("scalpBtn").classList.toggle("on",scalpOnly);
  if(lastBy) render(lastBy,lastHistByKey);
  syncChartToSelection();
}
document.getElementById("scalpBtn").addEventListener("click",toggleScalpOnly);

/* One dot per asset summarising its most actionable profile, so the tab row
   tells you where to look without opening each one. */
function assetDot(profiles){
  const rows=Object.values(profiles||{});
  if(!rows.length) return "";
  if(rows.some(r=>r.data_gate_ok===false)) return "stale";
  const decs=rows.map(r=>r.decision);
  if(decs.includes("LONG")) return "long";
  if(decs.includes("SHORT")) return "short";
  if(decs.includes("WAIT")) return "wait";
  return "";
}

/* Real-time-ish price ticker. Independent of the 30s Supabase poll: this
   hits /api/ticker (Kraken for BTC, Yahoo Finance quote for gold/silver)
   every ~6s, which is what makes the up/down arrows actually live instead
   of only moving once per 15-minute cron run. tickers/prevTickers do NOT
   persist across reloads, so a fresh page load never claims a false
   "change" against stale memory. Falls back to the signals_v2 snapshot
   price (any.price) wherever a ticker hasn't loaded yet or its fetch failed. */
let tickers={}, prevTickers={};
async function fetchTicker(asset){
  try{
    const r=await fetch(`/api/ticker?asset=${asset}`,{cache:"no-store"});
    if(!r.ok) return null;
    const j=await r.json();
    return j && j.price!=null ? j : null;
  }catch(e){ return null; }
}
async function pollTickers(){
  const results=await Promise.all(ORDER.map(a=>fetchTicker(a)));
  prevTickers=tickers;
  const next={...tickers};
  results.forEach((t,i)=>{ if(t) next[ORDER[i]]=t; });
  tickers=next;
  if(lastBy) render(lastBy,lastHistByKey);
  updateChartLivePrice();
}
function livePrice(asset,fallback){
  return tickers[asset]?.price ?? fallback;
}
function priceDelta(asset,fallback){
  const cur=livePrice(asset,fallback);
  const prev=prevTickers[asset]?.price;
  if(prev==null||cur==null) return {dir:"flat",abs:0,pct:0,has:false};
  const abs=cur-prev, pct=prev?100*abs/prev:0;
  return {dir:abs>0?"up":abs<0?"down":"flat",abs,pct,has:true};
}
function deltaHTML(d,dp){
  if(!d.has||d.dir==="flat") return `<span class="delta flat">—</span>`;
  const arrow=d.dir==="up"?"▲":"▼";
  return `<span class="delta ${d.dir}">${arrow} ${f(Math.abs(d.abs),dp)} (${d.pct>0?"+":""}${d.pct.toFixed(2)}%)</span>`;
}

function renderTabs(by){
  const el=document.getElementById("tabs");
  const avail=ORDER.filter(a=>by[a]);
  if(!avail.length){el.innerHTML="";return;}
  // if a previously-selected asset disappears from the feed, fall back to Sab
  if(selected!=="ALL" && !by[selected]) selected="ALL";

  const btns=[`<button class="tab ${selected==="ALL"?"on":""}" data-a="ALL"
      type="button">Sab</button>`];
  avail.forEach(a=>{
    const dp=DP[a]??2;
    const any=by[a].SWING||by[a].SCALP;
    const price=livePrice(a,any.price);
    const dot=assetDot(by[a]);
    const d=priceDelta(a,any.price);
    const arrow=d.has&&d.dir!=="flat"?(d.dir==="up"?" ▲":" ▼"):"";
    btns.push(`<button class="tab ${selected===a?"on":""}" data-a="${a}" type="button">
      <span class="dot ${dot}"></span>${esc(a)}
      <span class="px delta-${d.dir}">${f(price,dp)}${arrow}</span></button>`);
  });
  el.innerHTML=btns.join("");
  el.querySelectorAll(".tab").forEach(b=>
    b.addEventListener("click",()=>pickAsset(b.dataset.a)));
}

/* lastBy/lastHistByKey cache what fetchAndRender() last pulled from Supabase,
   so pickAsset() and pollTickers() can re-render without re-fetching. */
let lastBy=null, lastHistByKey={};

function render(by,histByKey){
  document.getElementById("sub").textContent=scalpOnly
    ? `${Object.keys(by).length} assets · SCALP setups only`
    : `${Object.keys(by).length} assets · SWING + SCALP`;
  renderTabs(by);
  const shown=ORDER.filter(a=>by[a]).filter(a=>selected==="ALL"||a===selected);

  document.getElementById("root").innerHTML=shown.map(a=>{
    const any=by[a].SWING||by[a].SCALP, dp=DP[a]??2;
    const price=livePrice(a,any.price);
    const gateOk=any.data_gate_ok, hard=arr(any.data_blockers);
    const d=priceDelta(a,any.price);
    return `<div class="asset">
      <div class="arow"><div><div class="aname">${esc(a)}</div></div>
        <div class="pricerow">
          <div class="price ${d.has&&d.dir!=="flat"?"flash":""}">${f(price,dp)}</div>
          ${deltaHTML(d,dp)}
          <div class="sincenote">live</div>
        </div>
      </div>
      ${FUTURES_PROXY[a]?`<div class="futwarn"><b>⚠️ YE FUTURES PRICE HAI, SPOT NAHI</b>
        Yahan dikhaya gaya price ${esc(FUTURES_PROXY[a])} ka hai (spot ${esc(a)} nahi) —
        real spot price is se <span class="gap">$30–100+ tak different</span> ho sakta hai
        jab futures contango/backwardation mein ho. <b style="display:inline;font-size:inherit">
        Entry/Stop/Target bhi isi futures price ke hisab se calculate hain.</b>
        Order lagane se pehle apne broker ka apna live spot price zaroor match karein.</div>`:""}
      ${!gateOk?`<div class="gate"><b>DATA PURANA HAI — trading band</b>
        ${hard.map(b=>`<div>✗ ${esc(b)}</div>`).join("")}
        <div style="color:var(--dim);margin-top:6px">Jab tak data purana hai koi
        signal nahi diya jayega — ye jaan boojh kar hai, koi kharabi nahi.</div></div>`:""}
      <div class="profiles">${(scalpOnly?["SCALP"]:PROFILES).map(p=>profileCard(p,by[a][p],dp,histByKey[a+"|"+p],price)).join("")}</div>
    </div>`;
  }).join("");

  document.getElementById("foot").innerHTML=`<b>Ye financial advice nahi hai.</b>
    Confluence score sirf confirmations ka weighted ratio hai — ye <b>probability
    nahi</b> hai. Abhi tak kisi bhi hissay ko real trade results ke against test
    nahi kiya gaya. Position size configured account equity par based hai, apni
    asal equity config me daalna zaroori hai.<br><br>
    <b>Ye data mojood nahi</b> (OHLCV se nikala nahi ja sakta): order book ·
    open interest · liquidation clusters · live bid-ask spread · tick volume ·
    futures roll calendar.`;
}

async function fetchAndRender(){
  const [{data,error},historyRows]=await Promise.all([fetchSignals(),fetchHistory()]);
  const root=document.getElementById("root");
  if(error){root.innerHTML=`<div class="empty">Error: ${esc(error.message)}</div>`;return;}
  if(!data||!data.length){root.innerHTML='<div class="empty">Waiting for first v2 sync…</div>';return;}

  const by={};data.forEach(r=>{(by[r.asset]=by[r.asset]||{})[r.profile]=r;});
  const newest=data.reduce((a,b)=>new Date(a.updated_at)>new Date(b.updated_at)?a:b);
  document.getElementById("age").textContent="signal data updated "+ago(newest.updated_at);

  lastBy=by; lastHistByKey=groupHistory(historyRows||[]);
  render(lastBy,lastHistByKey);
  syncChartToSelection();
}
/* Manual refresh. This re-reads the latest analysis already stored in
   Supabase — it does NOT re-run the engine. New analysis is produced by the
   GitHub Actions cron every 15 minutes, so pressing this more often than that
   will legitimately show the same numbers. The age indicator is the honest
   signal of how fresh the underlying data actually is. */
let refreshing=false;
async function manualRefresh(){
  if(refreshing) return;
  refreshing=true;
  const btn=document.getElementById("refresh");
  const lbl=document.getElementById("refreshLabel");
  btn.disabled=true; btn.classList.add("busy"); lbl.textContent="Refreshing";
  const started=Date.now();
  try{ await fetchAndRender(); }
  finally{
    // hold the spinner briefly so a fast refresh still reads as a response
    const wait=Math.max(0,450-(Date.now()-started));
    setTimeout(()=>{
      btn.disabled=false; btn.classList.remove("busy"); lbl.textContent="Refresh";
      refreshing=false;
    },wait);
  }
}
document.getElementById("refresh").addEventListener("click",manualRefresh);

    {t:"ATR",tag:"Average True Range",p:"Market abhi kitni move kar rahi hai (volatility) uska average. Stop Loss aksar ATR ke multiple mein rakha jata hai taake normal market noise se bach sake."},
  ]},
  {sec:"Market ka context",items:[
    {t:"HTF Bias",tag:"Higher Timeframe",p:"Bara trend (Weekly/Daily/4H jaisi badi timeframes se) — BULLISH (upar), BEARISH (neeche), ya MIXED (saaf nahi)."},
    {t:"Structure · BOS / CHoCH",p:"BOS (Break of Structure) matlab trend continue ho raha hai. CHoCH (Change of Character) matlab trend palatne ke asaar hain."},
    {t:"Premium / Discount",p:"Price apni recent range ke upper hisse (Premium — mehnga, selling ke liye behtar) mein hai ya lower hisse (Discount — sasta, buying ke liye behtar)."},
    {t:"Market ka mizaj (Regime)",p:"TRENDING (seedhi chal raha), RANGING (idhar udhar ghoom raha), ya COMPRESSION (bohot tang range, bara move aane wala ho sakta hai)."},
    {t:"DATA PURANA HAI",p:"Jab market band ho (jaise weekend par gold/silver) to naya data nahi aata. Aisi surat mein engine koi bhi signal nahi deta — ye galti nahi, jaan boojh kar hai."},
    {t:"XAUUSD ab spot hai",tag:"fixed",p:"Gold ab Kraken PAXGUSD se price leta hai — ek gold-backed token jo physical LBMA gold ke against 1:1 redeemable hai, is liye ye real spot gold ke bohot qareeb rehta hai (live test mein sirf 0.15% farq). Pehle COMEX futures (GC=F) istemal hota tha jo spot se $60+ (1.5%) door ja sakta tha — is wajah se entry/stop/target ghalat dikh rahe thay."},
    {t:"⚠️ Silver abhi bhi futures price hai",tag:"XAGUSD",p:"Silver ka koi free SPOT feed nahi mila (Kraken aur Binance dono par koi tokenized silver nahi hai), is liye ye abhi bhi COMEX futures (SI=F) proxy use kar raha hai — spot se different ho sakta hai. Har price, entry, stop, target isi futures number par based hai — asal order lagane se pehle apne broker ka live spot price zaroor check karein."},
  ]},
  {sec:"SWING vs SCALP",items:[
    {t:"SWING",tag:"1-5 din",p:"Bare timeframes (4H/Daily) par based, kam lekin zyada mazboot trades. Zyada der tak hold karna padta hai."},
    {t:"SCALP",tag:"15min-4h",p:"Chote timeframes (5M/15M) par based, tez trades kam waqt ke liye. Zyada risk buffer chahiye kyunke chote timeframe zyada 'noisy' hote hain."},
  ]},
];
function renderGuide(){
  document.getElementById("guideBody").innerHTML=GUIDE.map(s=>
    `<div class="gsec">${esc(s.sec)}</div>`+
    s.items.map(it=>`<div class="term"><h3>${esc(it.t)}${it.tag?` <span class="tag">${esc(it.tag)}</span>`:""}</h3>
      <p>${it.p}</p></div>`).join("")
  ).join("");
}
function openGuide(){renderGuide();document.getElementById("guideBackdrop").classList.add("open");}
function closeGuide(){document.getElementById("guideBackdrop").classList.remove("open");}
document.getElementById("guideBtn").addEventListener("click",openGuide);
document.getElementById("closeGuide").addEventListener("click",closeGuide);
document.getElementById("guideBackdrop").addEventListener("click",e=>{
  if(e.target.id==="guideBackdrop") closeGuide();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape") closeGuide();});

/* ---------------- CANDLESTICK CHART (Binance/TradingView-style) ---------------- */
/* Only shown for a single selected asset (not "Sab") — same convention as
   Binance's own per-pair chart. Historical candles come from /api/candles;
   the LAST (currently forming) candle is then live-updated on every ticker
   tick via candleSeries.update(), which is what gives the "watching it move"
   feel instead of a static picture that only refreshes every 30s. */
const TF_LIST=["5m","15m","1h","4h","1d"];
const TF_LABEL={"5m":"5M","15m":"15M","1h":"1H","4h":"4H","1d":"1D"};
let chartAsset=null, chartTF=localStorage.getItem("chartTF")||"1h";
let chartApi=null, candleSeries=null, lastCandle=null, chartLoadToken=0;

function initChartOnce(){
  if(chartApi) return;
  chartApi=LightweightCharts.createChart(document.getElementById("chartBox"),{
    layout:{background:{color:"transparent"},textColor:"#8a90a2",fontSize:11},
    grid:{vertLines:{color:"#1c212e"},horzLines:{color:"#1c212e"}},
    rightPriceScale:{borderColor:"#262b38"},
    timeScale:{borderColor:"#262b38",timeVisible:true,secondsVisible:false},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
    autoSize:true,
  });
  candleSeries=chartApi.addCandlestickSeries({
    upColor:"#22c55e",downColor:"#ef4444",borderVisible:false,
    wickUpColor:"#22c55e",wickDownColor:"#ef4444",
  });
}

function renderTfRow(){
  const el=document.getElementById("tfRow");
  el.innerHTML=TF_LIST.map(tf=>
    `<button class="tfbtn ${tf===chartTF?"on":""}" data-tf="${tf}" type="button">${TF_LABEL[tf]}</button>`
  ).join("");
  el.querySelectorAll(".tfbtn").forEach(b=>b.addEventListener("click",()=>setTF(b.dataset.tf)));
}
function setTF(tf){
  chartTF=tf;
  try{localStorage.setItem("chartTF",tf);}catch(e){}
  renderTfRow();
  loadChartData();
}

async function loadChartData(){
  if(!chartAsset) return;
  const token=++chartLoadToken; // guards against a slow older request landing after a newer one
  initChartOnce();
  const box=document.getElementById("chartBox");
  box.querySelectorAll(".charterr").forEach(n=>n.remove());
  try{
    const r=await fetch(`/api/candles?asset=${chartAsset}&tf=${chartTF}`,{cache:"no-store"});
    const j=await r.json();
    if(token!==chartLoadToken) return;
    if(!r.ok||!Array.isArray(j.candles)||!j.candles.length) throw new Error(j.error||"no candles");
    candleSeries.setData(j.candles);
    lastCandle=j.candles[j.candles.length-1];
    chartApi.timeScale().fitContent();
  }catch(e){
    if(token!==chartLoadToken) return;
    box.querySelectorAll(".charterr").forEach(n=>n.remove());
    const err=document.createElement("div");
    err.className="charterr";
    err.textContent="Chart load nahi hua: "+(e&&e.message||e);
    box.appendChild(err);
  }
}

function syncChartToSelection(){
  const wrap=document.getElementById("chartWrap");
  if(selected==="ALL"){ wrap.style.display="none"; chartAsset=null; return; }
  wrap.style.display="";
  document.getElementById("chartName").textContent=selected;
  const dp=DP[selected]??2;
  const snap=lastBy&&lastBy[selected]&&(lastBy[selected].SWING||lastBy[selected].SCALP);
  document.getElementById("chartPrice").textContent=f(livePrice(selected,snap?snap.price:null),dp);
  if(chartAsset===selected) return;
  chartAsset=selected;
  renderTfRow();
  loadChartData();
}

function updateChartLivePrice(){
  if(!chartAsset) return;
  const t=tickers[chartAsset];
  const dp=DP[chartAsset]??2;
  if(t) document.getElementById("chartPrice").textContent=f(t.price,dp);
  if(t && candleSeries && lastCandle){
    const updated={...lastCandle, close:t.price,
      high:Math.max(lastCandle.high,t.price), low:Math.min(lastCandle.low,t.price)};
    candleSeries.update(updated);
    lastCandle=updated;
  }
  const el=document.getElementById("chart24h");
  if(t && t.high24h!=null){
    const pct=t.changePct24h??0, chCls=pct>0?"up":pct<0?"down":"flat";
    el.innerHTML=`<span>24h High <b>${f(t.high24h,dp)}</b></span>
      <span>24h Low <b>${f(t.low24h,dp)}</b></span>
      <span>24h Change <b class="delta ${chCls}" style="font-size:11.5px">${pct>0?"+":""}${pct.toFixed(2)}%</b></span>`;
  } else {
    el.innerHTML="";
  }
}

fetchAndRender();setInterval(fetchAndRender,30000);
pollTickers();setInterval(pollTickers,2000);
</script>
