<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal Engine v2</title>
<style>
  :root{--bg:#0b0d12;--card:#151821;--card2:#1b1f2b;--bd:#262b38;--tx:#e6e9f0;
    --dim:#8a90a2;--grn:#22c55e;--red:#ef4444;--gry:#6b7280;--amb:#f59e0b;--blu:#3b82f6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,Helvetica,Arial,sans-serif;
    padding:max(18px,env(safe-area-inset-top)) 16px calc(env(safe-area-inset-bottom) + 32px)}
  header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;padding:4px 4px 16px}
  h1{font-size:18px;margin:0;font-weight:650}
  .sub{font-size:12px;color:var(--dim)}
  .asset{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
  .arow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .aname{font-size:17px;font-weight:650}
  .price{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .inst{font-size:11px;color:var(--dim)}
  .gate{background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.35);
    border-radius:10px;padding:10px 12px;margin:12px 0;font-size:12.5px}
  .gate b{color:var(--red)} .gate div{color:#fca5a5;margin-top:3px}
  .profiles{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
  @media(min-width:880px){.profiles{grid-template-columns:1fr 1fr}}
  .prof{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:14px}
  .ptop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
  .pname{font-weight:650;letter-spacing:.05em;font-size:11px;color:var(--dim)}
  .badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.03em;white-space:nowrap}
  .b-long{background:rgba(34,197,94,.16);color:var(--grn)}
  .b-short{background:rgba(239,68,68,.16);color:var(--red)}
  .b-wait{background:rgba(245,158,11,.16);color:var(--amb)}
  .b-no{background:rgba(107,114,128,.2);color:var(--gry)}
  .dirline{font-size:13px;margin:6px 0 10px;padding:8px 10px;border-radius:8px;
    background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.25)}
  .dirline b.long{color:var(--grn)} .dirline b.short{color:var(--red)}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-size:12.5px}
  .kv span:first-child{color:var(--dim)}
  .kv span:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:5px;background:var(--bd);border-radius:3px;overflow:hidden;margin:6px 0 10px}
  .bar div{height:100%;border-radius:3px}
  .lvls{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}
  .lvls td{padding:3px 0}
  .lvls td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .lvls td:first-child{color:var(--dim)}
  .sec{margin-top:12px;margin-bottom:4px;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.07em;color:var(--dim)}
  .rsn{font-size:12px;margin:3px 0;display:flex;gap:7px;align-items:flex-start}
  .rsn i{font-style:normal;flex:0 0 12px}
  .ok i{color:var(--grn)} .no i{color:var(--red)} .blk i{color:var(--amb)}
  .rsn span{opacity:.9}
  .warn{font-size:11.5px;color:var(--amb);margin-top:6px}
  .inval{font-size:11.5px;color:var(--dim);margin-top:6px}
  .foot{font-size:11px;color:var(--dim);margin-top:20px;padding:12px;
    background:var(--card);border:1px solid var(--bd);border-radius:10px}
  .foot b{color:var(--amb)}
  details summary{cursor:pointer;color:var(--dim);font-size:10.5px;
    text-transform:uppercase;letter-spacing:.07em;margin-top:10px}
  .z{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 0;
    border-bottom:1px solid var(--bd);font-size:12px}
  .z:last-child{border-bottom:none}
  .zk{color:var(--dim);font-size:11px}
  .zbar{height:4px;background:var(--bd);border-radius:2px;margin-top:4px;overflow:hidden}
  .zbar div{height:100%;background:var(--blu)}
  .side-buy{color:var(--grn)} .side-sell{color:var(--red)}
  .empty{text-align:center;color:var(--dim);padding:40px 0}
</style>
</head>
<body>

<header>
  <div><h1>Signal Engine v2</h1><div class="sub" id="sub">loading…</div></div>
  <div class="sub" id="age"></div>
</header>
<div id="root"><div class="empty">Loading…</div></div>
<div class="foot" id="foot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://vjjnowmsvngijxvkvqhx.supabase.co";
const SUPABASE_KEY="sb_publishable_FE879GUYSj-Pw1gp1-kZ2g_h9qbtHmP";
const ORDER=["XAUUSD","XAGUSD","BTCUSD"];
const DP={XAUUSD:2,XAGUSD:3,BTCUSD:2};
const PROFILES=["SWING","SCALP"];
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const f=(v,d)=>v==null?"—":Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const arr=v=>Array.isArray(v)?v:(v?JSON.parse(v):[]);
function ago(iso){const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+"m ago";
  if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago";}

function badge(d){const m={LONG:"b-long",SHORT:"b-short",WAIT:"b-wait"};
  return `<span class="badge ${m[d]||"b-no"}">${esc(d||"—")}</span>`;}

/* The headline sentence: what side was evaluated, and what the engine decided
   about it. This is the thing that was previously buried in a collapsed panel. */
function directionLine(r){
  const dir=r.direction_considered, dec=r.decision;
  if(!dir) return `<div class="dirline">No directional case evaluated — the data
    gate blocked analysis before a side could be assessed.</div>`;
  const cls=dir==="LONG"?"long":"short";
  const word=dir==="LONG"?"buying":"selling";
  let verdict;
  if(dec===dir) verdict=`<b class="${cls}">Take the ${dir}</b> — every gate passed and price is at the entry.`;
  else if(dec==="WAIT") verdict=`<b class="${cls}">${dir} setup is armed</b> — all gates passed, but price has not reached the entry yet, so the order rests.`;
  else verdict=`<b class="${cls}">${dir} was the stronger case</b>, but it is <b>rejected</b> — see gate failures below.`;
  return `<div class="dirline">The engine scored both sides and found the
    <b class="${cls}">${esc(dir)}</b> (${word}) case stronger. ${verdict}</div>`;
}

function zoneRow(z,dp){
  const side=z.side==="buy_side"?"side-buy":"side-sell";
  const lbl=z.side==="buy_side"?"buy-side ▲":"sell-side ▼";
  return `<div class="z"><div>
    <div><b>${f(z.low,dp)} – ${f(z.high,dp)}</b> <span class="${side}">${lbl}</span></div>
    <div class="zk">${esc((z.kinds||[]).slice(0,3).join(" · "))} · ${z.confirmations} conf ·
      ${z.tests} tests · ${z.distance_atr>0?"+":""}${z.distance_atr} ATR</div>
    <div class="zbar"><div style="width:${z.strength}%"></div></div></div>
    <div style="text-align:right"><b>${Math.round(z.strength)}</b>
    <div class="zk">${esc(z.probability)}</div></div></div>`;
}

function profileCard(name,r,dp){
  if(!r) return `<div class="prof"><div class="ptop"><span class="pname">${name}</span>
    ${badge(null)}</div><div class="sub">no data yet</div></div>`;
  const sc=r.confluence_score??0;
  const col=sc>=70?"var(--grn)":sc>=50?"var(--amb)":"var(--red)";
  const forR=arr(r.reasons_for), agR=arr(r.reasons_against), blk=arr(r.blockers);
  const rows=[];
  if(r.entry!=null) rows.push(`<tr><td>Entry <span class="zk">${esc(r.entry_type||"")}</span></td><td>${f(r.entry,dp)}</td></tr>`);
  if(r.stop!=null) rows.push(`<tr><td>Stop <span class="zk">${r.stop_atr} ATR</span></td><td>${f(r.stop,dp)}</td></tr>`);
  [1,2,3].forEach(i=>{const p=r["tp"+i];if(p!=null)
    rows.push(`<tr><td>T${i} <span class="zk">${esc(i===1?(r.tp1_anchor||""):"")}</span></td>
      <td>${f(p,dp)} <span class="zk">${r["tp"+i+"_rr"]??"—"}R</span></td></tr>`);});
  if(r.primary_rr!=null) rows.push(`<tr><td>R:R (T1)</td><td>${r.primary_rr}</td></tr>`);
  if(r.lots!=null) rows.push(`<tr><td>Size</td><td>${r.lots} lots</td></tr>`);

  return `<div class="prof">
    <div class="ptop"><span class="pname">${name} · ${esc(r.expected_hold||"")}</span>${badge(r.decision)}</div>
    ${directionLine(r)}
    <div class="kv"><span>Confluence</span><span>${sc}/100 (${r.confirmations_passed??"—"}/${r.confirmations_total??"—"})
      ${r.counter_trend?' <b style="color:var(--amb)">counter-trend</b>':""}</span></div>
    <div class="bar"><div style="width:${sc}%;background:${col}"></div></div>
    <div class="kv"><span>Regime</span><span>${esc(r.regime||"—")} (ADX ${r.adx??"—"})</span></div>
    <div class="kv"><span>HTF bias</span><span>${esc(r.htf_bias||"—")}</span></div>
    <div class="kv"><span>Structure</span><span>${esc(r.structure_trend||"—")} · ${esc(r.structure_event||"—")}</span></div>
    <div class="kv"><span>Premium/discount</span><span>${esc(r.pd_label||"—")} (${r.pd_position??"—"})</span></div>
    ${rows.length?`<table class="lvls">${rows.join("")}</table>`:""}
    ${r.invalidation?`<div class="inval"><b>Invalidation:</b> ${esc(r.invalidation)}</div>`:""}

    ${blk.length?`<div class="sec">Why it is not a trade</div>`+
      blk.map(b=>`<div class="rsn blk"><i>✗</i><span>${esc(b)}</span></div>`).join(""):""}

    ${forR.length?`<div class="sec">Evidence for the ${esc(r.direction_considered||"")} case</div>`+
      forR.map(x=>`<div class="rsn ok"><i>+</i><span>${esc(x)}</span></div>`).join(""):""}

    ${agR.length?`<div class="sec">Evidence against</div>`+
      agR.map(x=>`<div class="rsn no"><i>−</i><span>${esc(x)}</span></div>`).join(""):""}

    <details><summary>Liquidity map (${arr(r.zones).length})</summary>
      ${arr(r.zones).map(z=>zoneRow(z,dp)).join("")||'<div class="sub">none</div>'}
    </details>
  </div>`;
}

async function load(){
  const {data,error}=await client.from("signals_v2").select("*");
  const root=document.getElementById("root");
  if(error){root.innerHTML=`<div class="empty">Error: ${esc(error.message)}</div>`;return;}
  if(!data||!data.length){root.innerHTML='<div class="empty">Waiting for first v2 sync…</div>';return;}

  const by={};data.forEach(r=>{(by[r.asset]=by[r.asset]||{})[r.profile]=r;});
  const newest=data.reduce((a,b)=>new Date(a.updated_at)>new Date(b.updated_at)?a:b);
  document.getElementById("sub").textContent=`${Object.keys(by).length} assets · SWING + SCALP`;
  document.getElementById("age").textContent="updated "+ago(newest.updated_at);

  root.innerHTML=ORDER.filter(a=>by[a]).map(a=>{
    const any=by[a].SWING||by[a].SCALP, dp=DP[a]??2;
    const gateOk=any.data_gate_ok, hard=arr(any.data_blockers);
    return `<div class="asset">
      <div class="arow"><div><div class="aname">${esc(a)}</div></div>
        <div class="price">${f(any.price,dp)}</div></div>
      ${!gateOk?`<div class="gate"><b>DATA GATE FAILED — trading suspended</b>
        ${hard.map(b=>`<div>✗ ${esc(b)}</div>`).join("")}
        <div style="color:var(--dim);margin-top:6px">No signal is issued while the
        feed is stale — this is deliberate, not a fault.</div></div>`:""}
      <div class="profiles">${PROFILES.map(p=>profileCard(p,by[a][p],dp)).join("")}</div>
    </div>`;
  }).join("");

  document.getElementById("foot").innerHTML=`<b>Not financial advice.</b>
    confluence_score is a weighted confirmation-density ratio, <b>not</b> a calibrated
    probability — no component has been validated against realised trade outcomes.
    Position sizes assume the configured account equity.<br><br>
    <b>Unavailable data</b> (cannot be inferred from OHLCV): order book · open interest ·
    liquidation clusters · live bid-ask spread · tick-level volume · futures roll calendar.`;
}
load();setInterval(load,30000);
</script>
</body>
</html>
